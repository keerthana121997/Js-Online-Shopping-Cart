<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping App</title>

</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }

    body {
        background-color: rgb(210, 215, 215);
    }

    h1 {
        text-align: center;
    }

    .online-shopping-container {
        max-width: 800px;
        margin: auto;
        margin-top: 20px;
        background-color: white;
        padding: 10px 10px;
        border-radius: 5px;
        box-shadow: 0 4px 8px 0 gray;
    }

    .product-row {
        display: flex;
        justify-content: space-between;
        border: 1px solid black;
        padding: 10px;
        border-radius: 5px;
        align-items: center;
        margin: 5px;
    }

    button {
        background-color: rgb(73, 73, 244);
        border: none;
        padding: 10px 20px;
        border-radius: 10px;
        color: white;
        cursor: pointer;
    }

    button:hover {
        background-color: rgb(37, 37, 234);
    }

    h2 {
        margin: 10px 0;
    }

    #feedback {
        position: fixed;
        top: 10px;
        right: 50px;
        background-color: white;
        padding: 20px;
        display: none;
        color: whitesmoke;
    }

    #totalprice {
        text-align: right;
    }
</style>

<body>
    <div class="online-shopping-container">

        <h1>Online Shopping</h1>
        <p id="feedback">feedback</p>
        <h2>Available Products</h2>
        <div class="products-container" id="productsContainer">

        </div>
        <h2>My Cart</h2>
        <div id="cartContainer">

        </div>
        <h2 id="totalprice"></h2>
        <h2>Actions</h2>
        <button id="btnOrder">Sort by Price</button>
        <button id="clearcart">Clear Cart</button>

    </div>
</body>
<script src="script.js"></script>

</html>
